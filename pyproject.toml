[project]
name = "ctf-team-sync"
version = "0.2.0"
description = "Shared coordination for CTF teams and heterogeneous AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
]

[project.urls]
Repository = "https://github.com/Vo1ic/ctf-team-sync"
Issues = "https://github.com/Vo1ic/ctf-team-sync/issues"

[project.scripts]
team-sync-mcp = "team_sync.mcp:main"
team-sync-contracts = "team_sync.contracts:main"
team-sync-agent = "team_sync.agent:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
