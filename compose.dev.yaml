# Use with: docker compose -f compose.yaml -f compose.dev.yaml up --build -d
services:
  server:
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
    command:
      - sh
      - -c
      - >-
        uv run --no-sync alembic upgrade head &&
        exec uv run --no-sync uvicorn team_sync.api:create_app --factory
        --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
