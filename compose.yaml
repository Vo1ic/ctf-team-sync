services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: team_sync
      POSTGRES_PASSWORD: ${TEAM_SYNC_DB_PASSWORD:?Set TEAM_SYNC_DB_PASSWORD}
      POSTGRES_DB: team_sync
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_sync"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: .
    restart: unless-stopped
    environment:
      TEAM_SYNC_DATABASE_URL: postgresql+psycopg://team_sync:${TEAM_SYNC_DB_PASSWORD}@db:5432/team_sync
      TEAM_SYNC_BOOTSTRAP_TOKEN: ${TEAM_SYNC_BOOTSTRAP_TOKEN:?Set TEAM_SYNC_BOOTSTRAP_TOKEN}
      TEAM_SYNC_ARTIFACT_DIR: /data/artifacts
    ports:
      # Host port is configurable: TEAM_SYNC_HOST_PORT=8010 docker compose up -d
      - "127.0.0.1:${TEAM_SYNC_HOST_PORT:-8000}:8000"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
  artifacts:
