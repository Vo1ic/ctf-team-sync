# Public HTTPS for a team server: Caddy obtains a certificate for TEAM_SYNC_DOMAIN
# (DNS A/AAAA record must point at this host; ports 80 and 443 open).
#   TEAM_SYNC_DOMAIN=sync.example.org docker compose -f compose.yaml -f deploy/compose.public.yaml up -d
# The API stays on 127.0.0.1:${TEAM_SYNC_HOST_PORT} too, for agents running on the server
# itself and for SSH tunnels.
services:
  server:
    # Trust X-Forwarded-* only from the proxy network so cookies get Secure and the
    # browser same-origin check sees the public https:// origin.
    command:
      - sh
      - -c
      - >-
        uv run --no-sync alembic upgrade head &&
        exec uv run --no-sync uvicorn team_sync.api:create_app --factory
        --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      TEAM_SYNC_DOMAIN: ${TEAM_SYNC_DOMAIN:?Set TEAM_SYNC_DOMAIN to the public host name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
